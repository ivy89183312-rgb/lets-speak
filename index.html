<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Let's SPEAK — AI 口說練習夥伴</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --wood-dark: #241A12;
    --wood: #3B2A1A;
    --wood-light: #4A3626;
    --parchment: #F4EAD0;
    --parchment-edge: #E4D3A3;
    --ink: #3B2A1A;
    --ink-muted: #8A7A5C;
    --gold: #F2C572;
    --gold-dark: #C68A1E;
    --coral: #D9704A;
    --sage: #7BA36B;
    --sage-soft: #E4EFDD;
    --radius: 10px;
    --shadow: 3px 3px 0 rgba(0,0,0,.28);
    --pixel-font: 'Press Start 2P', 'Space Grotesk', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overscroll-behavior:none;}
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; }
  body{
    background: #EDE7DC;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 24px 12px;
    touch-action:manipulation;
    overscroll-behavior:none;
  }
  .app{
    width:100%;
    max-width: 460px;
    background: var(--wood-dark);
    border-radius: 20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height: calc(100vh - 48px);
    min-height: 600px;
    box-shadow: 0 50px 90px -30px rgba(0,0,0,0.5);
    position:relative;
    border: 4px solid var(--wood);
    touch-action:manipulation;
  }
  .screen{display:none; flex-direction:column; height:100%; width:100%;}
  .screen.active{display:flex;}

  /* ---------- Quest-giver header (chat screen) ---------- */
  .header{
    padding: 12px 14px; background: linear-gradient(180deg,var(--wood-light),var(--wood)); border-bottom: 4px solid var(--wood-dark);
    display:flex; align-items:center; gap:10px;
  }
  .avatar{
    width:44px; height:44px; border-radius:8px;
    background: var(--gold); border:3px solid var(--gold-dark);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; box-shadow: var(--shadow);
  }
  .avatar svg{width:24px; height:24px;}
  .header-info{flex:1; min-width:0;}
  .header-name{font-family: var(--pixel-font); font-weight:400; font-size:11px; color:var(--gold); display:flex; align-items:center; gap:6px; letter-spacing:.02em;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--sage); display:inline-block;}
  .header-sub{font-size:11px; color:#D8C6A0; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .icon-btn{background:var(--wood-light);border:2px solid var(--wood-dark);color:var(--gold); width:34px;height:34px;border-radius:8px;cursor:pointer; display:flex;align-items:center;justify-content:center;font-size:15px; flex-shrink:0; box-shadow: var(--shadow);}
  .icon-btn:hover{color:#fff; border-color:var(--gold);}
  .xp-badge{
    display:flex; align-items:center; gap:5px; background: var(--wood-light); color:var(--gold);
    font-family: var(--pixel-font); font-size:10px; padding: 7px 9px; border-radius:6px; flex-shrink:0; white-space:nowrap;
    border:2px solid var(--wood-dark); box-shadow: var(--shadow);
  }

  /* ---------- In-chat quest progress ---------- */
  .progress{display:flex; align-items:center; gap:0; padding: 10px 14px; background:var(--wood-dark);}
  .progress .node-wrap{display:flex; align-items:center; flex:1;}
  .progress .node{
    width:22px; height:22px; border-radius:5px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--pixel-font); font-size:8.5px;
    background: var(--wood-light); color:#8A7A5C; border:2px solid var(--wood);
  }
  .progress .node.done{background:var(--gold); border-color:var(--gold-dark); color:var(--wood-dark);}
  .progress .node.current{background:var(--parchment); border-color:var(--coral); color:var(--coral); animation: pulseNode 1.4s infinite;}
  @keyframes pulseNode{0%,100%{box-shadow:0 0 0 0 rgba(217,112,74,.5);}50%{box-shadow:0 0 0 5px rgba(217,112,74,0);}}
  .progress .connector{flex:1; height:3px; background:var(--wood-light); margin:0 2px;}
  .progress .connector.done{background:var(--gold-dark);}
  .step-label{
    font-family: var(--pixel-font); font-size:9px; color:var(--gold); padding: 0 14px 12px; background:var(--wood-dark);
    letter-spacing:.02em; border-bottom:3px solid var(--wood);
  }
  .step-label b{color:#fff;}

  /* ---------- Dialogue transcript ---------- */
  .transcript{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding: 16px 12px 6px;
    display:flex; flex-direction:column; gap:12px;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.03), transparent 40%),
      linear-gradient(180deg, #2A1F16, #1C130C 70%);
    overscroll-behavior:contain;
  }
  .dlg-row{display:flex; gap:8px; align-items:flex-start;}
  .dlg-row.me{flex-direction:row-reverse;}
  .dlg-portrait{
    width:34px; height:34px; border-radius:7px; flex-shrink:0; margin-top:2px;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    background: var(--gold); border:2px solid var(--gold-dark); box-shadow: var(--shadow);
  }
  .dlg-row.me .dlg-portrait{background:#D8CBAE; border-color:#A99968;}
  .dlg-col{display:flex; flex-direction:column; max-width:80%; gap:3px;}
  .dlg-row.me .dlg-col{align-items:flex-end;}
  .speaker-tag{font-family: var(--pixel-font); font-size:8px; letter-spacing:.03em; padding:0 3px;}
  .speaker-tag.npc{color:var(--gold);}
  .speaker-tag.player{color:#C9B98C;}

  .dlg-box{
    background: var(--parchment); border:3px solid var(--wood);
    border-radius: 6px; padding: 10px 13px; font-size:14px; line-height:1.6; color:var(--ink);
    box-shadow: var(--shadow);
    position:relative;
  }
  .dlg-row.me .dlg-box{background:#EFE3C4;}
  .dlg-box .qlabel{font-family: var(--pixel-font); font-size:8px; color:var(--coral); letter-spacing:.03em; margin-bottom:5px; display:block;}
  .timestamp{font-size:9.5px; color:#8A7A5C; padding: 0 4px;}

  /* 打碼／亂碼方塊風格（不是模糊，是真的亂碼字元） */
  .q-en{ transition: none; }
  .q-en.masked{
    font-family: var(--pixel-font); font-size:10.5px; line-height:2; letter-spacing:1px;
    color: var(--gold-dark); user-select:none; word-break:break-all;
  }
  .q-en.revealed{ font-family:'Inter',sans-serif; font-size:14px; line-height:1.55; color:var(--ink); }
  .q-zh{font-size:12.5px; color:var(--ink-muted); margin-top:4px;}
  .q-actions{display:flex; gap:8px; margin-top:9px;}
  .mini-action-btn{
    font-family: var(--pixel-font); font-size:8px; color:var(--wood-dark);
    background:var(--gold); border:2px solid var(--gold-dark); border-radius:5px;
    padding:6px 8px; cursor:pointer;
  }
  .mini-action-btn:hover{filter:brightness(1.05);}

  .full-row{width:100%; margin: 0 0 4px;}
  .image-card{
    width:100%; background: linear-gradient(180deg,#F9EFD6,var(--parchment)); border:3px solid var(--wood);
    border-radius:6px; padding:10px; box-shadow: var(--shadow);
  }
  .image-card .rc-title{font-family: var(--pixel-font); font-size:9px; color:var(--wood); letter-spacing:.03em; margin-bottom:8px;}
  .image-card img{width:100%; display:block; border-radius:4px; border:2px solid var(--wood-light);}
  .reward-card{
    width:100%; background: linear-gradient(180deg,#F9EFD6,var(--parchment)); border:3px solid var(--gold-dark);
    border-radius: 6px; padding:12px 14px; box-shadow: var(--shadow); color:var(--ink);
  }
  .reward-card .rc-title{font-family: var(--pixel-font); font-size:9px; color:var(--gold-dark); letter-spacing:.03em; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .reward-card .en-line{font-family:'Space Grotesk',sans-serif; font-size:14.5px; color:var(--ink); margin-top:2px;}
  .reward-card .zh-line{color:var(--ink-muted); font-size:12.5px; margin-top:4px;}
  .bubble.system-note{background:transparent; color:#C9B98C; font-size:12px; text-align:center; width:100%; padding:6px 10px;}

  .typing-row{display:flex; gap:8px; align-items:flex-start;}
  .typing-box{
    background: var(--parchment); border:3px solid var(--wood); border-radius:6px;
    padding:12px 16px; box-shadow: var(--shadow); display:flex; gap:4px;
  }
  .typing-box span{width:5px;height:5px;border-radius:50%;background:var(--ink-muted); animation: blink 1.1s infinite ease-in-out;}
  .typing-box span:nth-child(2){animation-delay:.15s;}
  .typing-box span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  .next-btn-row{display:flex; justify-content:center; padding: 4px 0 14px;}
  .next-btn{
    background: var(--gold); color:var(--wood-dark); border:3px solid var(--gold-dark);
    font-family: var(--pixel-font); font-size:10px; padding:11px 18px; border-radius:6px; cursor:pointer;
    box-shadow: var(--shadow); letter-spacing:.02em;
  }
  .next-btn:active{transform:translate(2px,2px); box-shadow:0 0 0 rgba(0,0,0,0);}
  .next-btn:hover{filter:brightness(1.05);}

  /* ---------- Command bar (input) ---------- */
  .input-bar{border-top:4px solid var(--wood); padding: 10px 12px 12px; background: var(--wood-dark); display:flex; flex-direction:column; gap:8px;}
  .ask-row{display:flex; justify-content:center;}
  .ask-link{background:none;border:none;color:#B7A57E; font-family: var(--pixel-font); font-size:8.5px; cursor:pointer; letter-spacing:.02em;}
  .ask-link:hover{color:var(--gold);}
  .input-row{display:flex; align-items:flex-end; gap:8px;}
  .cmd-prompt{font-family: var(--pixel-font); font-size:12px; color:var(--gold); padding-bottom:12px;}
  textarea#answerInput{
    flex:1; resize:none; background: var(--parchment); color:var(--ink);
    border:3px solid var(--wood-light); border-radius:8px;
    padding:10px 12px; font-family:'Inter',sans-serif; font-size:16px;
    max-height:90px; line-height:1.4;
  }
  textarea#answerInput:focus{outline:none; border-color:var(--gold);}
  .mic-btn, .send-btn{
    width:40px;height:40px;border-radius:8px;border:3px solid var(--wood-light);
    background:var(--wood-light); color:var(--gold); cursor:pointer; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px; box-shadow: var(--shadow);
  }
  .mic-btn.listening{background:var(--coral); border-color:#A6482D; color:#fff;}
  .send-btn{background:var(--gold); border-color:var(--gold-dark); color:var(--wood-dark);}
  .send-btn:disabled{opacity:.4; cursor:not-allowed;}
  .wave{display:flex; align-items:flex-end; gap:2px; height:14px;}
  .wave span{width:2px; background:#fff; animation: wave 0.9s infinite ease-in-out;}
  .wave span:nth-child(1){height:5px;} .wave span:nth-child(2){height:11px; animation-delay:.15s;}
  .wave span:nth-child(3){height:7px; animation-delay:.3s;} .wave span:nth-child(4){height:13px; animation-delay:.45s;}
  @keyframes wave{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}

  /* ---------- Level Cleared! ---------- */
  .completion{
    padding:22px 18px; background: linear-gradient(180deg,#F9EFD6,var(--parchment)); border:3px solid var(--gold-dark);
    border-radius:8px; width:100%; position:relative; overflow:hidden; text-align:center; box-shadow: var(--shadow);
  }
  .completion .badge-row{font-size:34px; margin-bottom:2px;}
  .completion .cleared-title{font-family: var(--pixel-font); font-size:13px; letter-spacing:.03em; margin: 8px 0 6px; color:var(--gold-dark); line-height:1.6;}
  .completion .cleared-sub{font-size:12.5px; color:var(--ink-muted); margin-bottom:12px;}
  .completion .xp-pill{display:inline-block; background:var(--gold); color:var(--wood-dark); font-family: var(--pixel-font); font-size:9.5px; padding:7px 14px; border-radius:6px; margin-bottom:14px; border:2px solid var(--gold-dark);}
  .completion .recap{text-align:left; background:rgba(255,255,255,.55); border-radius:8px; padding:12px 14px; border:1px solid var(--parchment-edge);}
  .completion .recap p{margin:0 0 6px; font-size:12.5px; color:var(--ink-muted);}
  .completion ul{margin:0; padding-left:18px; font-size:13.5px; line-height:1.6;}
  .restart-row{display:flex; flex-direction:column; align-items:center; padding-top:10px; gap:8px;}
  .confetti{position:absolute; top:-10px; width:8px; height:8px; border-radius:1px; animation: confettiFall linear forwards;}
  @keyframes confettiFall{0%{transform: translateY(0) rotate(0deg); opacity:1;}100%{transform: translateY(220px) rotate(360deg); opacity:0;}}
  .xp-toast{position:absolute; right:18px; top:50%; background:var(--gold); color:var(--wood-dark); font-family: var(--pixel-font); font-size:9.5px; padding:6px 10px; border-radius:6px; box-shadow: var(--shadow); animation: xpFloat 1.4s ease-out forwards; z-index:5; pointer-events:none; border:2px solid var(--gold-dark);}
  @keyframes xpFloat{0%{opacity:0; transform:translateY(6px) scale(.9);}15%{opacity:1; transform:translateY(0) scale(1);}75%{opacity:1; transform:translateY(-18px) scale(1);}100%{opacity:0; transform:translateY(-30px) scale(.95);}}

  /* ---------- Quest notice (gating) ---------- */
  .reminder-screen{
    position:absolute; inset:0; background: linear-gradient(180deg,#2A1F16,#1C130C); z-index:25;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 32px 26px; text-align:center; gap:10px;
  }
  .quest-icon{font-size:40px; margin-bottom:2px;}
  .quest-tag{font-family: var(--pixel-font); font-size:9px; letter-spacing:.05em; color:var(--wood-dark); background:var(--gold); padding:6px 12px; border-radius:6px; border:2px solid var(--gold-dark);}
  .reminder-screen h2{font-family: var(--pixel-font); font-size:13px; margin:4px 0 0; color:#fff; line-height:1.7;}
  .reminder-screen p{color:#D8C6A0; font-size:13.5px; line-height:1.7; margin:0; max-width:300px;}
  .reminder-screen p b{color:var(--gold);}
  .reminder-actions{display:flex; flex-direction:column; gap:8px; width:100%; max-width:260px; margin-top:8px;}
  .reminder-actions .next-btn{width:100%;}
  .link-btn{background:none;border:none;color:#B7A57E; font-size:13px; text-decoration:underline; cursor:pointer;}

  /* ================= RPG OVERWORLD MAP ================= */
  .map-hud{display:flex; align-items:center; gap:8px; padding:12px 14px; background: linear-gradient(180deg,var(--wood-light),var(--wood)); border-bottom: 4px solid var(--wood-dark);}
  .map-title{flex:1; font-family: var(--pixel-font); font-size:11px; color:var(--gold); letter-spacing:.02em; display:flex; align-items:center; gap:6px;}
  .pixel-chip{font-family: var(--pixel-font); font-size:10px; color:var(--wood-dark); background:var(--gold); padding:7px 8px; border-radius:6px; box-shadow: var(--shadow); display:flex; align-items:center; gap:5px; white-space:nowrap; border:2px solid var(--gold-dark);}
  .map-path{
    position:relative; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding: 30px 14px 60px;
    display:flex; flex-direction:column-reverse; gap:50px;
    background: repeating-conic-gradient(#79B968 0% 25%, #6DA95D 0% 50%) 0 0/26px 26px, linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,.18) 100%);
    overscroll-behavior:contain;
  }
  .map-deco{position:absolute; font-size:24px; opacity:.6; pointer-events:none; filter:saturate(.85); text-shadow:0 2px 0 rgba(0,0,0,.15);}
  .path-node-row{display:flex; align-items:center; position:relative; z-index:2;}
  .path-node-row.left{justify-content:flex-start; padding-left:10px;}
  .path-node-row.right{justify-content:flex-end; padding-right:10px;}
  .path-node-col{display:flex; flex-direction:column; align-items:center; gap:5px; position:relative;}
  .path-node{
    width:58px; height:58px; border-radius:10px; background:#F2C572; border:3px solid #B4622F;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.2), 4px 4px 0 rgba(0,0,0,.3);
    cursor:pointer; color:#3B2A1A; font-family: var(--pixel-font); position:relative;
  }
  .path-node .lvl-tag{position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); background:#3B2A1A; color:#F2C572; font-family: var(--pixel-font); font-size:8px; padding:2px 6px; border-radius:4px; white-space:nowrap;}
  .path-node.locked{background:#8B9186; border-color:#5F6459; box-shadow: inset 0 3px 0 rgba(255,255,255,.15), inset 0 -4px 0 rgba(0,0,0,.25), 4px 4px 0 rgba(0,0,0,.3); cursor:not-allowed;}
  .path-node.done{background:#FFD24C; border-color:#C68A1E;}
  .path-node.current{background:#fff; border-color:var(--coral); animation: nodeGlow 1.4s infinite;}
  .path-node.boss{background:#E7DFF0; border-color:#6E4E8F;}
  @keyframes nodeGlow{0%,100%{box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.2), 4px 4px 0 rgba(0,0,0,.3), 0 0 0 0 rgba(217,112,74,.5);}50%{box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.2), 4px 4px 0 rgba(0,0,0,.3), 0 0 0 8px rgba(217,112,74,0);}}
  .quest-mark{position:absolute; top:-26px; font-size:20px; animation: bounceMark 1s infinite;}
  @keyframes bounceMark{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .here-tag{position:absolute; top:-46px; background:#2C1F14; color:#F2C572; font-family: var(--pixel-font); font-size:8px; padding:5px 8px; border-radius:4px; white-space:nowrap;}
  .here-tag::after{content:''; position:absolute; bottom:-4px; left:50%; transform:translateX(-50%); border:4px solid transparent; border-top-color:#2C1F14;}
  .node-caption-row{display:flex; align-items:center; gap:6px; margin-top:6px;}
  .node-caption{font-size:11px; color:#fff; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.4);}
  .share-node-btn{
    background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.3); color:#fff; font-size:11px;
    width:21px; height:21px; border-radius:5px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .share-node-btn:hover{background:rgba(0,0,0,.6);}
  .lock-toast{position:absolute; left:50%; bottom:20px; transform:translateX(-50%); background:#2C1F14; color:#F2C572; font-family: var(--pixel-font); font-size:9.5px; padding:10px 14px; border-radius:6px; box-shadow:var(--shadow); z-index:10; opacity:0; transition:opacity .2s; text-align:center; line-height:1.7; max-width:230px;}
  .lock-toast.show{opacity:1;}

  /* ---------- Share modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:20px; z-index:40;}
  .overlay.open{display:flex;}
  .panel{background:#FBF8F2; border-radius:16px; padding:22px; width:100%; max-width:400px; max-height:84vh; overflow-y:auto; box-shadow: 0 8px 30px rgba(0,0,0,.3); color:#2C2620;}
  .panel h3{margin:0 0 4px; font-family:'Space Grotesk',sans-serif;}
  .panel p.desc{color:#8A8172; font-size:13px; line-height:1.5; margin:0 0 12px;}
  .share-url{font-size:12px; word-break:break-all; background:#F4F1E9; border:1px solid #E3DBCB; border-radius:8px; padding:10px 12px; margin-bottom:12px; color:#2C2620;}
  .panel-footer{display:flex; gap:8px;}
  .btn-primary, .btn-secondary{flex:1; padding:9px; border-radius:10px; border:none; cursor:pointer; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12.5px;}
  .btn-primary{background:#D97C4A; color:#fff;}
  .btn-secondary{background:transparent; border:1px solid #E3DBCB; color:#2C2620;}
  .qr-box{display:flex; justify-content:center; padding:14px; background:#fff; border-radius:12px;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--wood-light); border-radius:3px;}
</style>
</head>
<body>

<div class="app" id="appRoot">

  <!-- ===================== RPG PATH MAP ===================== -->
  <div class="screen" id="mapScreen">
    <div class="map-hud">
      <button class="icon-btn" id="mapBackBtn" style="display:none;">✕</button>
      <div class="map-title">🗺️ QUEST MAP</div>
      <div class="pixel-chip" id="mapLvChip">LV.1</div>
      <div class="pixel-chip" id="mapXpBadge">💎 0</div>
    </div>
    <div class="map-path" id="mapPath"></div>
  </div>

  <!-- ===================== QUEST DIALOGUE (CHAT) ===================== -->
  <div class="screen" id="chatScreen">
    <div class="header">
      <div class="avatar">

/* ============================================================

   ============================================================ */
const LS_KEY = 'letsspeak_state_v2';
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    if(parsed && typeof parsed === 'object'){
      return { totalXP: parsed.totalXP || 0, units: parsed.units || {} };
    }
  }catch(e){ /* ignore */ }
  return { totalXP: 0, units: {} };
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(appState)); }catch(e){ /* storage full/blocked — ignore */ }
}
function getUnitState(id){
  if(!appState.units[id]) appState.units[id] = { stepIndex: 0, completed: false, history: [], roleplayTurn: 0, roleplayDone: false };
  return appState.units[id];
}
function isUnitDone(id){
  return !!(appState.units[id] && appState.units[id].completed);
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nowTime(){ return new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' }); }
function unitUrl(id){ return window.location.origin + window.location.pathname + '?unit=' + encodeURIComponent(id); }

/* ============================================================
   SOUND EFFECTS (Web Audio — 不用載任何音檔)
   ============================================================ */
let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx) audioCtx = new Ctx();
  }
  return audioCtx;
}
function playTone(freq, duration, type, volume){
  try{
    const ctx = ensureAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = volume != null ? volume : 0.12;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.stop(ctx.currentTime + duration);
  }catch(e){ /* ignore */ }
}
function sfx(kind){
  switch(kind){
    case 'click': playTone(600, 0.07, 'square', 0.05); break;
    case 'send': playTone(520, 0.08, 'square', 0.07); setTimeout(() => playTone(720, 0.08, 'square', 0.06), 55); break;
    case 'success': playTone(660, 0.09, 'sine', 0.09); setTimeout(() => playTone(880, 0.13, 'sine', 0.09), 100); break;
    case 'levelup': [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 0.16, 'triangle', 0.12), i * 90)); break;
    case 'lock': playTone(220, 0.16, 'sawtooth', 0.07); break;
    case 'mic': playTone(880, 0.06, 'sine', 0.06); break;
    case 'micoff': playTone(440, 0.08, 'sine', 0.06); break;
  }
}

/* ============================================================
   ROUTING / GATING
   ============================================================ */
function getRequestedUnitId(){
  const params = new URLSearchParams(window.location.search);
  return params.get('unit');
}
function goToUnit(id){ window.location.search = '?unit=' + encodeURIComponent(id); }
function goHome(){ window.location.search = ''; }

function boot(){
  renderXp();
  route();
}
function route(){
  const requestedId = getRequestedUnitId();
  if(requestedId){
    let idx = UNITS.findIndex(u => u.id === requestedId);
    if(idx === -1) idx = 0;
    const priorMissing = UNITS.slice(0, idx).filter(u => !isUnitDone(u.id));
    showScreen('chat');
    if(priorMissing.length > 0){
      showReminder(idx, priorMissing[0]);
    } else {
      startUnit(idx);
    }
  } else {
    showScreen('map');
    renderMap();
  }
}
function showReminder(requestedIdx, firstMissingUnit){
  const requestedUnit = UNITS[requestedIdx];
  const missingIdx = UNITS.findIndex(u => u.id === firstMissingUnit.id);
  document.getElementById('reminderTitle').textContent = `Level ${requestedIdx + 1} 暫時鎖定中`;
  document.getElementById('reminderText').innerHTML =
    `你想挑戰的是 <b>Level ${requestedIdx + 1}：${escapeHtml(requestedUnit.title)}</b>，`
    + `不過任務日誌顯示 <b>Level ${missingIdx + 1}：${escapeHtml(firstMissingUnit.title)}</b> 還沒過關。`
    + `先完成它，解鎖效果會更好，也能拿到更多 💎！`;
  reminderScreen.style.display = 'flex';
  document.getElementById('goToPriorBtn').onclick = () => { sfx('click'); goToUnit(firstMissingUnit.id); };
  document.getElementById('startAnywayBtn').onclick = () => {
    sfx('click');
    reminderScreen.style.display = 'none';
    startUnit(requestedIdx);
  };
}
function startUnit(idx, opts){
  opts = opts || {};
  currentUnitIdx = idx;
  const unit = UNITS[idx];
  const state = getUnitState(unit.id);

  if(opts.forceRestart){
    state.stepIndex = 0;
    state.completed = false;
    state.history = [];
    state.roleplayTurn = 0;
    state.roleplayDone = false;
    saveState();
  }

  hasActiveChat = true;
  transcriptEl.innerHTML = '';
  if(unit.image){ addImageCard(unit.image, unit.title); }
  collectedSuggestions = state.history.filter(h => h.type !== 'roleplay').map(h => ({ label: h.label, text: h.suggestedAnswer }))
    .concat(state.history.filter(h => h.type === 'roleplay' && h.altLine).map(h => ({ label: "Let's SPEAK", text: h.altLine })));

  if(state.completed){
    renderReviewMode(unit, state);
    return;
  }

  stepIndex = state.stepIndex || 0;
  const observeHistory = state.history.filter(h => h.type !== 'roleplay');
  observeHistory.forEach(h => renderHistoryEntry(h));

  mainInputRow.style.display = 'flex';
  askToggle.style.display = 'inline';

  if(stepIndex < unit.steps.length){
    inRoleplay = false;
    askCurrentQuestion();
  } else if(unit.roleplay && !state.roleplayDone){
    inRoleplay = true;
    const roleplayHistory = state.history.filter(h => h.type === 'roleplay');
    roleplayHistory.forEach(h => renderHistoryEntry(h));
    resumeRoleplayStage(roleplayHistory);
  } else {
    showCompletion();
  }
}
function renderReviewMode(unit, state){
  mainInputRow.style.display = 'none';
  askToggle.style.display = 'none';
  stepIndex = unit.steps.length;
  inRoleplay = false;
  renderProgress();
  addSystemNote('✅ 你已經完成這一關了，以下是你的作答紀錄：');
  state.history.forEach(h => renderHistoryEntry(h));
  const row = document.createElement('div');
  row.className = 'restart-row';
  row.innerHTML = `<button class="next-btn" id="mapReturnBtn2">🗺 返回地圖</button><button class="link-btn" id="restartBtn2">🔁 重新挑戰這一關</button>`;
  transcriptEl.appendChild(row);
  document.getElementById('mapReturnBtn2').addEventListener('click', () => { sfx('click'); goHome(); });
  document.getElementById('restartBtn2').addEventListener('click', () => { sfx('click'); startUnit(currentUnitIdx, { forceRestart: true }); });
}

/* ---- Text-to-speech（明確挑選英文語音，避免唸成奇怪的口音/語言） ---- */
let cachedVoices = [];
function refreshVoices(){
  if('speechSynthesis' in window) cachedVoices = window.speechSynthesis.getVoices();
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickEnglishVoice(){
  if(!cachedVoices.length) return null;
  return cachedVoices.find(v => /en-US/i.test(v.lang) && /google|natural|premium|enhanced/i.test(v.name))
    || cachedVoices.find(v => /en-US/i.test(v.lang))
    || cachedVoices.find(v => /^en/i.test(v.lang))
    || null;
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    if(!cachedVoices.length) refreshVoices();
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.92;
    utter.pitch = 1;
    const v = pickEnglishVoice();
    if(v) utter.voice = v;
    window.speechSynthesis.speak(utter);
  }catch(e){ /* ignore */ }
}

/* ---- 打碼／亂碼方塊（不是模糊，是真的用亂碼字元置換） ---- */
const MOSAIC_CHARS = '█▓▒░▚▞▙▟◆';
function mosaicText(text){
  return (text || '').replace(/[A-Za-z0-9]/g, () => MOSAIC_CHARS[Math.floor(Math.random() * MOSAIC_CHARS.length)]);
}

async function getFeedback(label, question, answer){
  const response = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode: "feedback", label, question, answer })
  });
  const data = await response.json();
  if(!response.ok || data.error){ console.error('AI proxy error:', data.error); throw new Error(data.error || 'API error'); }
  return data;
}
async function askAI(question, askText){
  const response = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode: "ask", question, askText })
  });
  const data = await response.json();
  if(!response.ok || data.error){ console.error('AI proxy error:', data.error); throw new Error(data.error || 'API error'); }
  return data;
}
async function getRoleplayTurn(situation, question, answer, k1Pool, altPool, continuePool){
  const response = await fetch(WORKER_URL, {

async function submitAnswer(text){
  if(busy) return;
  busy = true;
  sendBtn.disabled = true;
  addMeMessage(text);
  mainInputRow.style.display = 'none';
  showTyping();
  try{
    if(inRoleplay){
      await submitRoleplayAnswer(text);
    } else {
      await submitObserveAnswer(text);
    }
  }finally{
    busy = false;
    sendBtn.disabled = false;
  }
}
async function submitObserveAnswer(text){
  const step = currentUnit().steps[stepIndex];
  try{
    const result = await getFeedback(step.label, step.question, text);
    hideTyping();
    sfx('success');
    addAiDialogueInstant(`<span class="qlabel">🌟 STATUS</span>${escapeHtml(result.positiveFeedback || '')}`);
    await new Promise(r => setTimeout(r, 60));
    addRewardCard('💰 NEW PHRASE UNLOCKED', `<div class="en-line">${escapeHtml(result.suggestedAnswer || '')}</div><div class="zh-line">${escapeHtml(result.suggestedAnswerZh || '')}</div>`);
    if(result.quickTip && result.quickTip !== 'null'){
      addRewardCard('🔎 QUICK TIP', `<div>${escapeHtml(result.quickTip)}</div>`, 'tip-card');
    }
    collectedSuggestions.push({ label: step.label, text: result.suggestedAnswer || '' });

    const state = getUnitState(currentUnit().id);
    state.history.push({
      type: 'observe',
      label: step.label, question: step.question, questionZh: step.questionZh || '',
      studentAnswer: text, positiveFeedback: result.positiveFeedback || '',
      suggestedAnswer: result.suggestedAnswer || '', suggestedAnswerZh: result.suggestedAnswerZh || '',
      quickTip: (result.quickTip && result.quickTip !== 'null') ? result.quickTip : null
    });
    state.stepIndex = stepIndex + 1;
    saveState();

    const row = document.createElement('div');
    row.className = 'next-btn-row';
    row.innerHTML = `<button class="next-btn" id="nextBtn">▶ 繼續任務</button>`;
    transcriptEl.appendChild(row);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    awardXp(10, row);
    document.getElementById('nextBtn').addEventListener('click', () => {
      sfx('click');
      row.remove();
      stepIndex += 1;
      askCurrentQuestion();
    }, { once:true });
  }catch(err){
    console.error('submitObserveAnswer failed:', err);
    hideTyping();
    addSystemNote(`回饋產生時發生問題（${escapeHtml(err.message || '未知錯誤')}），請再回答一次試試看。`);
    mainInputRow.style.display = 'flex';
    answerInput.value = text;
  }
}
async function submitRoleplayAnswer(text){
  const unit = currentUnit();
  const rp = unit.roleplay;
  const state = getUnitState(unit.id);
  try{
    const result = await getRoleplayTurn(rp.situation, currentRoleplayQuestion.en, text, rp.k1Pool, rp.altPool, rp.continuePool);
    hideTyping();
    sfx('success');
    addAiDialogueInstant(`<span class="qlabel">🌟 STATUS</span>${escapeHtml(result.positiveFeedback || '')}`);
    await new Promise(r => setTimeout(r, 60));
    addAiDialogueInstant(escapeHtml(result.validateLine || ''), '🎭');
    if(result.altLine){
      addRewardCard('💡 更好的說法', `<div class="en-line">${escapeHtml(result.altLine)}</div><div class="zh-line">${escapeHtml(result.altLineZh || '')}</div>`);
    }

    const entry = {
      type: 'roleplay',
      question: currentRoleplayQuestion.en, questionZh: currentRoleplayQuestion.zh,
      studentAnswer: text, positiveFeedback: result.positiveFeedback || '', validateLine: result.validateLine || '',
      altLine: result.altLine || null, altLineZh: result.altLineZh || null,
      nextLine: result.nextLine || '', nextLineZh: result.nextLineZh || ''
    };
    state.history.push(entry);
    state.roleplayTurn = (state.roleplayTurn || 0) + 1;
    saveState();
    if(entry.altLine) collectedSuggestions.push({ label: "Let's SPEAK", text: entry.altLine });

    const isLast = state.roleplayTurn >= ROLEPLAY_TURNS_REQUIRED;
    const row = document.createElement('div');
    row.className = 'next-btn-row';
    row.innerHTML = `<button class="next-btn" id="nextBtn">${isLast ? '🎉 完成這一關 →' : '▶ 繼續對話'}</button>`;
    transcriptEl.appendChild(row);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    awardXp(10, row);
    document.getElementById('nextBtn').addEventListener('click', () => {
      sfx('click');
      row.remove();
      if(isLast){
        state.roleplayDone = true;
        saveState();
        inRoleplay = false;
        showCompletion();
      } else {
        presentRoleplayQuestion({ en: entry.nextLine, zh: entry.nextLineZh });
      }
    }, { once:true });
  }catch(err){
    console.error('submitRoleplayAnswer failed:', err);
    hideTyping();
    addSystemNote(`回饋產生時發生問題（${escapeHtml(err.message || '未知錯誤')}），請再回答一次試試看。`);
    mainInputRow.style.display = 'flex';
    answerInput.value = text;
  }
}

      <div class="rc-title">💬 ASK COACH IVY</div>
      <div style="display:flex; gap:8px; margin-top:6px;">
        <textarea id="askInput" rows="1" style="flex:1; background:#fff; color:var(--ink); border:2px solid var(--wood-light); border-radius:8px; padding:8px 12px; font-family:'Inter',sans-serif; font-size:16px;" placeholder="例如：prefer 是什麼意思？"></textarea>
        <button class="send-btn" id="askSendBtn">➤</button>
      </div>
    </div>`;
    transcriptEl.appendChild(row);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    document.getElementById('askSendBtn').addEventListener('click', async () => {
      const q = document.getElementById('askInput').value.trim();
      if(!q) return;
      sfx('send');
      row.remove();
      addMeMessage(q);
      showTyping();
      try{
        const qCtx = inRoleplay ? (currentRoleplayQuestion ? currentRoleplayQuestion.en : '') : (currentUnit().steps[stepIndex] ? currentUnit().steps[stepIndex].question : '');
        const result = await askAI(qCtx, q);
        hideTyping();
        addAiDialogueInstant(escapeHtml(result.answer || ''), '💡');
      }catch(err){
        hideTyping();
        addSystemNote('回答時發生問題，請再試一次。');
      }
      askOpen = false;
      askToggle.textContent = '💬 詢問一個英文問題';
      mainInputRow.style.display = 'flex';
    });
  } else {
    askToggle.textContent = '💬 詢問一個英文問題';
    const r = document.getElementById('askRow');
    if(r) r.remove();
    mainInputRow.style.display = 'flex';
  }
});

/* ---------------- Voice input (continuous — 只有按停止才會停) ---------------- */
const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
let baseTextBeforeListening = '';
if(SpeechRecognitionImpl){
  recognition = new SpeechRecognitionImpl();
  recognition.lang = 'en-US';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = (e) => {
    let finalChunk = '';
    let interimChunk = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const transcript = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalChunk += transcript;
      else interimChunk += transcript;
    }
    if(finalChunk) baseTextBeforeListening = (baseTextBeforeListening + ' ' + finalChunk).trim();
    answerInput.value = (baseTextBeforeListening + ' ' + interimChunk).trim();
  };
  recognition.onerror = () => { /* 忽略偶發錯誤，交給 onend 處理是否要自動重啟 */ };
  recognition.onend = () => {
    if(!manualStopRecognition){
      try{ recognition.start(); }catch(e){ /* ignore */ }
    } else {
      recognizing = false;
      micBtn.classList.remove('listening');
      micBtn.innerHTML = '🎙';
    }
  };
  micBtn.addEventListener('click', () => {
    if(recognizing){
      sfx('micoff');
      manualStopRecognition = true;
      recognition.stop();
      return;
    }
    sfx('mic');
    manualStopRecognition = false;
    baseTextBeforeListening = answerInput.value ? answerInput.value.trim() : '';
    recognizing = true;
    micBtn.classList.add('listening');
    micBtn.innerHTML = '<div class="wave"><span></span><span></span><span></span><span></span></div>';
    try{ recognition.start(); }catch(e){ /* ignore */ }
  });
} else {
  micBtn.style.display = 'none';
}

boot();
</script>
