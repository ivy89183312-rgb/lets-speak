<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Let's SPEAK — AI 口說練習夥伴</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --wood-dark: #241A12;
    --wood: #3B2A1A;
    --wood-light: #4A3626;
    --parchment: #F4EAD0;
    --parchment-edge: #E4D3A3;
    --ink: #3B2A1A;
    --ink-muted: #8A7A5C;
    --gold: #F2C572;
    --gold-dark: #C68A1E;
    --coral: #D9704A;
    --sage: #7BA36B;
    --sage-soft: #E4EFDD;
    --radius: 10px;
    --shadow: 3px 3px 0 rgba(0,0,0,.28);
    --pixel-font: 'Press Start 2P', 'Space Grotesk', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: #EDE7DC;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 24px 12px;
  }
  .app{
    width:100%;
    max-width: 460px;
    background: var(--wood-dark);
    border-radius: 20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height: calc(100vh - 48px);
    min-height: 600px;
    box-shadow: 0 50px 90px -30px rgba(0,0,0,0.5);
    position:relative;
    border: 4px solid var(--wood);
  }
  .screen{display:none; flex-direction:column; height:100%; width:100%;}
  .screen.active{display:flex;}

  .pixel-font{font-family: var(--pixel-font);}

  /* ---------- Quest-giver header (chat screen) ---------- */
  .header{
    padding: 12px 14px; background: linear-gradient(180deg,var(--wood-light),var(--wood)); border-bottom: 4px solid var(--wood-dark);
    display:flex; align-items:center; gap:10px;
  }
  .avatar{
    width:44px; height:44px; border-radius:8px;
    background: var(--gold); border:3px solid var(--gold-dark);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; box-shadow: var(--shadow);
  }
  .avatar svg{width:24px; height:24px;}
  .header-info{flex:1; min-width:0;}
  .header-name{font-family: var(--pixel-font); font-weight:400; font-size:11px; color:var(--gold); display:flex; align-items:center; gap:6px; letter-spacing:.02em;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--sage); display:inline-block;}
  .header-sub{font-size:11px; color:#D8C6A0; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .icon-btn{background:var(--wood-light);border:2px solid var(--wood-dark);color:var(--gold); width:34px;height:34px;border-radius:8px;cursor:pointer; display:flex;align-items:center;justify-content:center;font-size:15px; flex-shrink:0; box-shadow: var(--shadow);}
  .icon-btn:hover{color:#fff; border-color:var(--gold);}
  .xp-badge{
    display:flex; align-items:center; gap:5px; background: var(--wood-light); color:var(--gold);
    font-family: var(--pixel-font); font-size:10px; padding: 7px 9px; border-radius:6px; flex-shrink:0; white-space:nowrap;
    border:2px solid var(--wood-dark); box-shadow: var(--shadow);
  }

  /* ---------- In-chat quest progress ---------- */
  .progress{display:flex; align-items:center; gap:0; padding: 10px 14px; background:var(--wood-dark);}
  .progress .node-wrap{display:flex; align-items:center; flex:1;}
  .progress .node{
    width:22px; height:22px; border-radius:5px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--pixel-font); font-size:8.5px;
    background: var(--wood-light); color:#8A7A5C; border:2px solid var(--wood);
  }
  .progress .node.done{background:var(--gold); border-color:var(--gold-dark); color:var(--wood-dark);}
  .progress .node.current{background:var(--parchment); border-color:var(--coral); color:var(--coral); animation: pulseNode 1.4s infinite;}
  @keyframes pulseNode{0%,100%{box-shadow:0 0 0 0 rgba(217,112,74,.5);}50%{box-shadow:0 0 0 5px rgba(217,112,74,0);}}
  .progress .connector{flex:1; height:3px; background:var(--wood-light); margin:0 2px;}
  .progress .connector.done{background:var(--gold-dark);}
  .step-label{
    font-family: var(--pixel-font); font-size:9px; color:var(--gold); padding: 0 14px 12px; background:var(--wood-dark);
    letter-spacing:.02em; border-bottom:3px solid var(--wood);
  }
  .step-label b{color:#fff;}

  /* ---------- Dialogue transcript ---------- */
  .transcript{
    flex:1; overflow-y:auto; padding: 16px 12px 6px;
    display:flex; flex-direction:column; gap:12px;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.03), transparent 40%),
      linear-gradient(180deg, #2A1F16, #1C130C 70%);
  }
  .dlg-row{display:flex; gap:8px; align-items:flex-start;}
  .dlg-row.me{flex-direction:row-reverse;}
  .dlg-portrait{
    width:34px; height:34px; border-radius:7px; flex-shrink:0; margin-top:2px;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    background: var(--gold); border:2px solid var(--gold-dark); box-shadow: var(--shadow);
  }
  .dlg-row.me .dlg-portrait{background:#D8CBAE; border-color:#A99968;}
  .dlg-col{display:flex; flex-direction:column; max-width:80%; gap:3px;}
  .dlg-row.me .dlg-col{align-items:flex-end;}
  .speaker-tag{font-family: var(--pixel-font); font-size:8px; letter-spacing:.03em; padding:0 3px;}
  .speaker-tag.npc{color:var(--gold);}
  .speaker-tag.player{color:#C9B98C;}

  .dlg-box{
    background: var(--parchment); border:3px solid var(--wood);
    border-radius: 6px; padding: 10px 13px; font-size:14px; line-height:1.6; color:var(--ink);
    box-shadow: var(--shadow);
    position:relative;
  }
  .dlg-row.me .dlg-box{background:#EFE3C4;}
  .dlg-box .qlabel{font-family: var(--pixel-font); font-size:8px; color:var(--coral); letter-spacing:.03em; margin-bottom:5px; display:block;}
  .dlg-box.typing-cursor::after{content:'▌'; animation: caretBlink .8s infinite; color:var(--ink-muted); margin-left:1px;}
  @keyframes caretBlink{0%,50%{opacity:1;}51%,100%{opacity:0;}}
  .timestamp{font-size:9.5px; color:#8A7A5C; padding: 0 4px;}

  .full-row{width:100%; margin: 0 0 4px;}
  .reward-card{
    width:100%; background: linear-gradient(180deg,#F9EFD6,var(--parchment)); border:3px solid var(--gold-dark);
    border-radius: 6px; padding:12px 14px; box-shadow: var(--shadow); color:var(--ink);
  }
  .reward-card .rc-title{font-family: var(--pixel-font); font-size:9px; color:var(--gold-dark); letter-spacing:.03em; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .reward-card .en-line{font-family:'Space Grotesk',sans-serif; font-size:14.5px; color:var(--ink); margin-top:2px;}
  .tip-card{
    width:100%; background:rgba(244,234,208,.12); border:2px dashed #6B5A3E; border-radius:6px;
    padding:10px 13px; color:#D8C6A0; font-size:12.5px;
  }
  .tip-card .rc-title{font-family: var(--pixel-font); font-size:8px; color:var(--gold); margin-bottom:4px; display:block;}
  .bubble.system-note{background:transparent; color:#C9B98C; font-size:12px; text-align:center; width:100%; padding:6px 10px;}

  .typing-row{display:flex; gap:8px; align-items:flex-start;}
  .typing-box{
    background: var(--parchment); border:3px solid var(--wood); border-radius:6px;
    padding:12px 16px; box-shadow: var(--shadow); display:flex; gap:4px;
  }
  .typing-box span{width:5px;height:5px;border-radius:50%;background:var(--ink-muted); animation: blink 1.1s infinite ease-in-out;}
  .typing-box span:nth-child(2){animation-delay:.15s;}
  .typing-box span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  .next-btn-row{display:flex; justify-content:center; padding: 4px 0 14px;}
  .next-btn{
    background: var(--gold); color:var(--wood-dark); border:3px solid var(--gold-dark);
    font-family: var(--pixel-font); font-size:10px; padding:11px 18px; border-radius:6px; cursor:pointer;
    box-shadow: var(--shadow); letter-spacing:.02em;
  }
  .next-btn:active{transform:translate(2px,2px); box-shadow:0 0 0 rgba(0,0,0,0);}
  .next-btn:hover{filter:brightness(1.05);}

  /* ---------- Command bar (input) ---------- */
  .input-bar{border-top:4px solid var(--wood); padding: 10px 12px 12px; background: var(--wood-dark); display:flex; flex-direction:column; gap:8px;}
  .ask-row{display:flex; justify-content:center;}
  .ask-link{background:none;border:none;color:#B7A57E; font-family: var(--pixel-font); font-size:8.5px; cursor:pointer; letter-spacing:.02em;}
  .ask-link:hover{color:var(--gold);}
  .input-row{display:flex; align-items:flex-end; gap:8px;}
  .cmd-prompt{font-family: var(--pixel-font); font-size:12px; color:var(--gold); padding-bottom:12px;}
  textarea#answerInput{
    flex:1; resize:none; background: var(--parchment); color:var(--ink);
    border:3px solid var(--wood-light); border-radius:8px;
    padding:10px 12px; font-family:'Inter',sans-serif; font-size:14px;
    max-height:90px; line-height:1.4;
  }
  textarea#answerInput:focus{outline:none; border-color:var(--gold);}
  .mic-btn, .send-btn{
    width:40px;height:40px;border-radius:8px;border:3px solid var(--wood-light);
    background:var(--wood-light); color:var(--gold); cursor:pointer; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px; box-shadow: var(--shadow);
  }
  .mic-btn.listening{background:var(--coral); border-color:#A6482D; color:#fff;}
  .send-btn{background:var(--gold); border-color:var(--gold-dark); color:var(--wood-dark);}
  .send-btn:disabled{opacity:.4; cursor:not-allowed;}
  .wave{display:flex; align-items:flex-end; gap:2px; height:14px;}
  .wave span{width:2px; background:#fff; animation: wave 0.9s infinite ease-in-out;}
  .wave span:nth-child(1){height:5px;} .wave span:nth-child(2){height:11px; animation-delay:.15s;}
  .wave span:nth-child(3){height:7px; animation-delay:.3s;} .wave span:nth-child(4){height:13px; animation-delay:.45s;}
  @keyframes wave{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}

  /* ---------- Level Cleared! ---------- */
  .completion{
    padding:22px 18px; background: linear-gradient(180deg,#F9EFD6,var(--parchment)); border:3px solid var(--gold-dark);
    border-radius:8px; width:100%; position:relative; overflow:hidden; text-align:center; box-shadow: var(--shadow);
  }
  .completion .badge-row{font-size:34px; margin-bottom:2px;}
  .completion .cleared-title{font-family: var(--pixel-font); font-size:13px; letter-spacing:.03em; margin: 8px 0 6px; color:var(--gold-dark); line-height:1.6;}
  .completion .cleared-sub{font-size:12.5px; color:var(--ink-muted); margin-bottom:12px;}
  .completion .xp-pill{display:inline-block; background:var(--gold); color:var(--wood-dark); font-family: var(--pixel-font); font-size:9.5px; padding:7px 14px; border-radius:6px; margin-bottom:14px; border:2px solid var(--gold-dark);}
  .completion .recap{text-align:left; background:rgba(255,255,255,.55); border-radius:8px; padding:12px 14px; border:1px solid var(--parchment-edge);}
  .completion .recap p{margin:0 0 6px; font-size:12.5px; color:var(--ink-muted);}
  .completion ul{margin:0; padding-left:18px; font-size:13.5px; line-height:1.6;}
  .restart-row{display:flex; flex-direction:column; align-items:center; padding-top:10px; gap:8px;}
  .confetti{position:absolute; top:-10px; width:8px; height:8px; border-radius:1px; animation: confettiFall linear forwards;}
  @keyframes confettiFall{0%{transform: translateY(0) rotate(0deg); opacity:1;}100%{transform: translateY(220px) rotate(360deg); opacity:0;}}
  .xp-toast{position:absolute; right:18px; top:50%; background:var(--gold); color:var(--wood-dark); font-family: var(--pixel-font); font-size:9.5px; padding:6px 10px; border-radius:6px; box-shadow: var(--shadow); animation: xpFloat 1.4s ease-out forwards; z-index:5; pointer-events:none; border:2px solid var(--gold-dark);}
  @keyframes xpFloat{0%{opacity:0; transform:translateY(6px) scale(.9);}15%{opacity:1; transform:translateY(0) scale(1);}75%{opacity:1; transform:translateY(-18px) scale(1);}100%{opacity:0; transform:translateY(-30px) scale(.95);}}

  /* ---------- Quest notice (gating) ---------- */
  .reminder-screen{
    position:absolute; inset:0; background: linear-gradient(180deg,#2A1F16,#1C130C); z-index:25;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 32px 26px; text-align:center; gap:10px;
  }
  .quest-icon{font-size:40px; margin-bottom:2px;}
  .quest-tag{font-family: var(--pixel-font); font-size:9px; letter-spacing:.05em; color:var(--wood-dark); background:var(--gold); padding:6px 12px; border-radius:6px; border:2px solid var(--gold-dark);}
  .reminder-screen h2{font-family: var(--pixel-font); font-size:13px; margin:4px 0 0; color:#fff; line-height:1.7;}
  .reminder-screen p{color:#D8C6A0; font-size:13.5px; line-height:1.7; margin:0; max-width:300px;}
  .reminder-screen p b{color:var(--gold);}
  .reminder-actions{display:flex; flex-direction:column; gap:8px; width:100%; max-width:260px; margin-top:8px;}
  .reminder-actions .next-btn{width:100%;}
  .link-btn{background:none;border:none;color:#B7A57E; font-size:12.5px; text-decoration:underline; cursor:pointer;}

  /* ================= RPG OVERWORLD MAP ================= */
  .map-hud{display:flex; align-items:center; gap:8px; padding:12px 14px; background: linear-gradient(180deg,var(--wood-light),var(--wood)); border-bottom: 4px solid var(--wood-dark);}
  .map-title{flex:1; font-family: var(--pixel-font); font-size:11px; color:var(--gold); letter-spacing:.02em; display:flex; align-items:center; gap:6px;}
  .pixel-chip{font-family: var(--pixel-font); font-size:10px; color:var(--wood-dark); background:var(--gold); padding:7px 8px; border-radius:6px; box-shadow: var(--shadow); display:flex; align-items:center; gap:5px; white-space:nowrap; border:2px solid var(--gold-dark);}
  .map-path{
    position:relative; flex:1; overflow-y:auto; padding: 30px 14px 60px;
    display:flex; flex-direction:column-reverse; gap:50px;
    background: repeating-conic-gradient(#79B968 0% 25%, #6DA95D 0% 50%) 0 0/26px 26px, linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,.18) 100%);
  }
  .map-deco{position:absolute; font-size:24px; opacity:.6; pointer-events:none; filter:saturate(.85); text-shadow:0 2px 0 rgba(0,0,0,.15);}
  .path-node-row{display:flex; align-items:center; position:relative; z-index:2;}
  .path-node-row.left{justify-content:flex-start; padding-left:10px;}
  .path-node-row.right{justify-content:flex-end; padding-right:10px;}
  .path-node-col{display:flex; flex-direction:column; align-items:center; gap:5px; position:relative;}
  .path-node{
    width:58px; height:58px; border-radius:10px; background:#F2C572; border:3px solid #B4622F;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.2), 4px 4px 0 rgba(0,0,0,.3);
    cursor:pointer; color:#3B2A1A; font-family: var(--pixel-font); position:relative;
  }
  .path-node .lvl-tag{position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); background:#3B2A1A; color:#F2C572; font-family: var(--pixel-font); font-size:8px; padding:2px 6px; border-radius:4px; white-space:nowrap;}
  .path-node.locked{background:#8B9186; border-color:#5F6459; box-shadow: inset 0 3px 0 rgba(255,255,255,.15), inset 0 -4px 0 rgba(0,0,0,.25), 4px 4px 0 rgba(0,0,0,.3); cursor:not-allowed;}
  .path-node.done{background:#FFD24C; border-color:#C68A1E;}
  .path-node.current{background:#fff; border-color:var(--coral); animation: nodeGlow 1.4s infinite;}
  .path-node.boss{background:#E7DFF0; border-color:#6E4E8F;}
  @keyframes nodeGlow{0%,100%{box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.2), 4px 4px 0 rgba(0,0,0,.3), 0 0 0 0 rgba(217,112,74,.5);}50%{box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.2), 4px 4px 0 rgba(0,0,0,.3), 0 0 0 8px rgba(217,112,74,0);}}
  .quest-mark{position:absolute; top:-26px; font-size:20px; animation: bounceMark 1s infinite;}
  @keyframes bounceMark{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .here-tag{position:absolute; top:-46px; background:#2C1F14; color:#F2C572; font-family: var(--pixel-font); font-size:8px; padding:5px 8px; border-radius:4px; white-space:nowrap;}
  .here-tag::after{content:''; position:absolute; bottom:-4px; left:50%; transform:translateX(-50%); border:4px solid transparent; border-top-color:#2C1F14;}
  .node-caption{font-size:11px; color:#fff; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.4); margin-top:6px;}
  .lock-toast{position:absolute; left:50%; bottom:20px; transform:translateX(-50%); background:#2C1F14; color:#F2C572; font-family: var(--pixel-font); font-size:9.5px; padding:10px 14px; border-radius:6px; box-shadow:var(--shadow); z-index:10; opacity:0; transition:opacity .2s; text-align:center; line-height:1.7; max-width:230px;}
  .lock-toast.show{opacity:1;}

  /* ---------- Overlay / admin panel ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:20px; z-index:40;}
  .overlay.open{display:flex;}
  .panel{background:#FBF8F2; border-radius:16px; padding:22px; width:100%; max-width:440px; max-height:84vh; overflow-y:auto; box-shadow: 0 8px 30px rgba(0,0,0,.3); color:#2C2620;}
  .panel h3{margin:0 0 4px; font-family:'Space Grotesk',sans-serif;}
  .panel p.desc{color:#8A8172; font-size:13px; line-height:1.5; margin:0 0 14px;}
  .unit-row{border:1px solid #E3DBCB; border-radius:14px; padding:12px 14px; margin-bottom:10px; position:relative;}
  .unit-row.locked{opacity:.6; background:#F4F1E9;}
  .unit-row-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .unit-row-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px;}
  .level-num{width:22px; height:22px; border-radius:50%; background:#E3DBCB; color:#8A8172; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .unit-row:not(.locked) .level-num{background:#D97C4A; color:#fff;}
  .unit-status{font-size:11.5px; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .unit-status.done{background:#E7EFE3; color:#6E8F6A;}
  .unit-status.todo{background:#F4E3D3; color:#D97C4A;}
  .unit-status.locked{background:#E3DBCB; color:#8A8172;}
  .unit-row-link{font-size:11.5px; color:#8A8172; margin-top:6px; word-break:break-all;}
  .unit-row-actions{display:flex; gap:8px; margin-top:10px;}
  .small-btn{flex:1; padding:7px; border-radius:9px; border:1px solid #E3DBCB; background:#fff; font-size:12px; cursor:pointer; color:#2C2620;}
  .small-btn:hover{border-color:#D97C4A; color:#D97C4A;}
  .qr-box{display:none; justify-content:center; padding:12px; background:#fff; border-radius:12px; margin-top:10px;}
  .qr-box.open{display:flex;}
  .panel-footer{display:flex; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid #E3DBCB;}
  .btn-primary, .btn-secondary{flex:1; padding:9px; border-radius:10px; border:none; cursor:pointer; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12.5px;}
  .btn-primary{background:#D97C4A; color:#fff;}
  .btn-secondary{background:transparent; border:1px solid #E3DBCB; color:#2C2620;}
  .advanced{margin-top:14px;}
  .advanced summary{cursor:pointer; font-size:12.5px; color:#8A8172;}
  .advanced textarea{width:100%; height:160px; background:#fff; color:#2C2620; border:1px solid #E3DBCB; border-radius:10px; padding:10px; font-family:monospace; font-size:11.5px; margin-top:8px;}
  .err{color:#C15C4A; font-size:12px; margin-top:6px; display:none;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--wood-light); border-radius:3px;}
</style>
</head>
<body>

<div class="app" id="appRoot">

  <!-- ===================== RPG PATH MAP ===================== -->
  <div class="screen" id="mapScreen">
    <div class="map-hud">
      <button class="icon-btn" id="mapBackBtn" style="display:none;">✕</button>
      <div class="map-title">🗺️ QUEST MAP</div>
      <div class="pixel-chip" id="mapLvChip">LV.1</div>
      <div class="pixel-chip" id="mapXpBadge">💎 0</div>
      <button class="icon-btn" id="mapAdminBtn" title="教材管理（給老師用）">⚙</button>
    </div>
    <div class="map-path" id="mapPath"></div>
  </div>

/* ============================================================

const DEFAULT_UNITS = [

    { label: "Situation", question: "You arrive at the office for a job interview. The receptionist greets you while you wait." },
    { label: "Main Question", question: "What would you say to make polite small talk with the receptionist?" }

let UNITS = DEFAULT_UNITS;

/* ============================================================
   STATE
   ============================================================ */
let currentUnitIdx = 0;
let stepIndex = 0;
let collectedSuggestions = [];
let busy = false;
let recognizing = false;
let recognition = null;
let completedUnits = [];
let totalXP = 0;
let hasActiveChat = false;

const screens = {
  map: document.getElementById('mapScreen'),

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('active'));

}

const transcriptEl = document.getElementById('transcript');
const progressBar = document.getElementById('progressBar');
const stepLabelEl = document.getElementById('stepLabel');

const answerInput = document.getElementById('answerInput');

const micBtn = document.getElementById('micBtn');

const mapXpBadgeEl = document.getElementById('mapXpBadge');
const mapLvChipEl = document.getElementById('mapLvChip');

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nowTime(){ return new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' }); }
function unitUrl(id){ return window.location.origin + window.location.pathname + '?unit=' + encodeURIComponent(id); }

/* ============================================================
   STORAGE
   ============================================================ */
async function loadCompleted(){
  try{
    const res = await window.storage.get('completed-units', false);
    completedUnits = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ completedUnits = []; }
  try{
    const res2 = await window.storage.get('total-xp', false);
    totalXP = res2 && res2.value ? (parseInt(res2.value, 10) || 0) : 0;
  }catch(e){ totalXP = 0; }
  renderXp();
}
async function markUnitComplete(id){
  if(!completedUnits.includes(id)) completedUnits.push(id);
  try{ await window.storage.set('completed-units', JSON.stringify(completedUnits), false); }catch(e){}
}
function renderXp(){
  xpBadgeEl.textContent = `⭐ ${totalXP}`;
  mapXpBadgeEl.textContent = `💎 ${totalXP}`;
  mapLvChipEl.textContent = `LV.${completedUnits.length + 1}`;
}
async function awardXp(amount, anchorEl){
  totalXP += amount;
  renderXp();
  try{ await window.storage.set('total-xp', String(totalXP), false); }catch(e){}
  if(anchorEl){
    const toast = document.createElement('div');
    toast.className = 'xp-toast';
    toast.textContent = `+${amount} XP`;
    anchorEl.style.position = 'relative';
    anchorEl.appendChild(toast);
    setTimeout(() => toast.remove(), 1400);
  }
}

/* ============================================================
   ROUTING / GATING
   ============================================================ */
function getRequestedUnitId(){
  const params = new URLSearchParams(window.location.search);
  return params.get('unit');
}
function goToUnit(id){ window.location.search = '?unit=' + encodeURIComponent(id); }
function goHome(){ window.location.search = ''; }

async function boot(){
  await loadCompleted();
  route();
}
function route(){
  const requestedId = getRequestedUnitId();
  if(requestedId){
    let idx = UNITS.findIndex(u => u.id === requestedId);
    if(idx === -1) idx = 0;
    const priorMissing = UNITS.slice(0, idx).filter(u => !completedUnits.includes(u.id));
    showScreen('chat');
    if(priorMissing.length > 0){
      showReminder(idx, priorMissing[0]);
    } else {
      startUnit(idx);
    }
  } else {
    showScreen('map');
    renderMap();
  }
}
function showReminder(requestedIdx, firstMissingUnit){
  const requestedUnit = UNITS[requestedIdx];
  const missingIdx = UNITS.findIndex(u => u.id === firstMissingUnit.id);
  document.getElementById('reminderTitle').textContent = `LEVEL ${requestedIdx + 1} LOCKED`;
  document.getElementById('reminderText').innerHTML =
    `你想挑戰的是 <b>Level ${requestedIdx + 1}：${escapeHtml(requestedUnit.title)}</b>，`
    + `不過任務日誌顯示 <b>Level ${missingIdx + 1}：${escapeHtml(firstMissingUnit.title)}</b> 還沒過關。`
    + `先完成它，解鎖效果會更好，也能拿到更多 💎！`;
  reminderScreen.style.display = 'flex';
  document.getElementById('goToPriorBtn').onclick = () => goToUnit(firstMissingUnit.id);
  document.getElementById('startAnywayBtn').onclick = () => {
    reminderScreen.style.display = 'none';
    startUnit(requestedIdx);
  };
}
function startUnit(idx){
  currentUnitIdx = idx;
  stepIndex = 0;
  collectedSuggestions = [];
  hasActiveChat = true;
  transcriptEl.innerHTML = '';
  mainInputRow.style.display = 'flex';
  askToggle.style.display = 'inline';
  askCurrentQuestion();
}

/* ============================================================
   RPG PATH MAP RENDERING
   ============================================================ */
const DECOR = ['🌲','🌳','🪨','🌲','🌳','🍂','🌲','🪨'];
function renderMap(){
  renderXp();
  document.getElementById('mapBackBtn').style.display = hasActiveChat ? 'flex' : 'none';
  const pathEl = document.getElementById('mapPath');
  pathEl.innerHTML = '';
  let nextUpFound = false;
  UNITS.forEach((u, idx) => {
    const done = completedUnits.includes(u.id);
    const locked = idx > 0 && UNITS.slice(0, idx).some(p => !completedUnits.includes(p.id));
    const isNextUp = !done && !locked && !nextUpFound;
    if(isNextUp) nextUpFound = true;
    const isBoss = idx === UNITS.length - 1;
    const side = idx % 2 === 0 ? 'left' : 'right';
    let statusClass = done ? 'done' : (locked ? 'locked' : 'current');
    if(isBoss && !locked) statusClass += ' boss';
    let icon = done ? '🏆' : (locked ? '🔒' : (isBoss ? '🏰' : (idx + 1)));
    const row = document.createElement('div');
    row.className = 'path-node-row ' + side;
    row.innerHTML = `
      <div class="path-node-col">
        ${isNextUp ? '<div class="quest-mark">❗</div><div class="here-tag">你在這裡</div>' : ''}
        <div class="path-node ${statusClass}" data-id="${u.id}" data-locked="${locked}" data-level="${idx+1}">
          ${icon}
          <div class="lvl-tag">LV${idx + 1}</div>
        </div>
        <div class="node-caption">${escapeHtml(u.title)}</div>
      </div>`;
    pathEl.appendChild(row);
  });
  for(let i = 0; i < 6; i++){
    const deco = document.createElement('div');
    deco.className = 'map-deco';
    deco.textContent = DECOR[i % DECOR.length];
    deco.style.left = (8 + (i * 37) % 82) + '%';
    deco.style.bottom = (6 + (i * 53) % 88) + '%';
    pathEl.appendChild(deco);
  }
  pathEl.querySelectorAll('.path-node').forEach(node => {
    node.addEventListener('click', () => {
      if(node.dataset.locked === 'true'){
        showLockToast(`🔒 先完成前面的關卡\n才能挑戰 LV${node.dataset.level} 喔！`);
      } else {
        goToUnit(node.dataset.id);
      }
    });
  });
}
function showLockToast(msg){
  const existing = document.getElementById('lockToast');
  if(existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'lock-toast';
  toast.id = 'lockToast';
  toast.style.whiteSpace = 'pre-line';
  toast.textContent = msg;
  document.getElementById('mapScreen').appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 250); }, 2200);
}
document.getElementById('mapBackBtn').addEventListener('click', () => showScreen('chat'));
document.getElementById('mapOpenBtn').addEventListener('click', () => { renderMap(); showScreen('map'); });

/* ============================================================
   QUEST DIALOGUE (CHAT) RENDERING
   ============================================================ */
function currentUnit(){ return UNITS[currentUnitIdx]; }

function renderProgress(){
  const unit = currentUnit();
  progressBar.innerHTML = '';
  unit.steps.forEach((s, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'node-wrap';
    const node = document.createElement('div');

    node.textContent = i < stepIndex ? '✓' : (i + 1);
    wrap.appendChild(node);
    if(i < unit.steps.length - 1){
      const conn = document.createElement('div');
      conn.className = 'connector ' + (i < stepIndex ? 'done' : '');
      wrap.appendChild(conn);
    }
    progressBar.appendChild(wrap);
  });
  const cur = unit.steps[stepIndex];
  stepLabelEl.innerHTML = cur
    ? `LV${currentUnitIdx + 1} 任務 ${stepIndex+1}/${unit.steps.length}　<b>${escapeHtml(cur.label)}</b>`
    : '關卡完成！';
  materialTitleEl.textContent = `LV${currentUnitIdx + 1}：${unit.title}`;
}

/* Typewriter reveal for dialogue text — click to skip */
function typeText(el, text, speed){
  return new Promise(resolve => {
    speed = speed || 16;
    let i = 0;
    el.textContent = '';
    el.classList.add('typing-cursor');
    let done = false;
    function finish(){
      if(done) return;
      done = true;
      el.textContent = text;
      el.classList.remove('typing-cursor');
      el.removeEventListener('click', finish);
      clearInterval(timer);
      resolve();
    }
    const timer = setInterval(() => {
      i++;
      el.textContent = text.slice(0, i);
      if(i >= text.length) finish();
    }, speed);
    el.addEventListener('click', finish);
  });
}

function addAiDialogue(labelHtml, text, portrait){
  const row = document.createElement('div');
  row.className = 'dlg-row';
  row.innerHTML = `<div class="dlg-portrait">${portrait || '🦉'}</div>

      <div class="dlg-box">${labelHtml || ''}<span class="dlg-text"></span></div>
      <div class="timestamp">${nowTime()}</div>
    </div>`;
  transcriptEl.appendChild(row);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
  const textEl = row.querySelector('.dlg-text');
  typeText(textEl, text, 14).then(() => { transcriptEl.scrollTop = transcriptEl.scrollHeight; });
  return row;
}

function askCurrentQuestion(){

async function showCompletion(){
  await markUnitComplete(currentUnit().id);
  mainInputRow.style.display = 'none';
  askToggle.style.display = 'none';
  let listHtml = collectedSuggestions.map(s => `<li><b>${escapeHtml(s.label)}:</b> ${escapeHtml(s.text)}</li>`).join('');
  const bonusXp = 30;
  const card = addRewardCard('', `
    <div class="badge-row" style="text-align:center;">🏆</div>
    <div class="cleared-title" style="text-align:center;">LEVEL ${currentUnitIdx + 1}<br>CLEARED!</div>
    <div class="cleared-sub" style="text-align:center;">${escapeHtml(currentUnit().title)}　·　任務全部完成</div>
    <div style="text-align:center;"><span class="xp-pill">+${bonusXp} XP 通關獎勵</span></div>

function spawnConfetti(container){

    container.appendChild(bit);
    setTimeout(() => bit.remove(), 2500);

}

/* ============================================================
   AI CALLS (via your own Cloudflare Worker + Gemini API)
   ============================================================ */
// 部署好 Worker 之後，把下面這個網址換成你自己的 Worker 網址
// 例如："https://lets-speak-proxy.your-subdomain.workers.dev"
const WORKER_URL = "https://letsspeak.ivy89183312.workers.dev";

async function callClaude(system, userContent){
  const response = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system: system, message: userContent })
  });
  const data = await response.json();
  if(!response.ok || data.error){ console.error('AI proxy error:', data.error); throw new Error(data.error || 'API error'); }
  let raw = (data.text || '').replace(/```json|```/g, '').trim();
  if(!raw){ console.error('Empty response from proxy:', data); throw new Error('Empty response'); }
  try{ return JSON.parse(raw); }
  catch(parseErr){
    const match = raw.match(/\{[\s\S]*\}/);
    if(match){ try{ return JSON.parse(match[0]); }catch(e2){} }
    console.error('Could not parse JSON from response:', raw);
    throw new Error('Bad JSON from model — raw: ' + raw.slice(0, 200));
  }
}
const FEEDBACK_SYSTEM = `你是「Let's SPEAK AI Speaking Partner」中負責產生回饋的模組。你不是出題者，絕對不可以出新題目、不可以做 follow-up 問題、不可以建議下一題內容，只需要針對「這一題」與「學生剛才的回答」產生回饋。

規則：
1. 一律先給正向回饋，語氣溫暖、絕對不可以是負面評價——即使學生答錯、答非所問、只回一個字、用中文回答、中英混合、寫「不知道/I don't know」也一樣。正向回饋不代表把錯的答案說成對的。
2. 一定要提供 Suggested Answer，且必須：符合目前這一題、約1–3句、自然道地的英文、TOEIC 700–990 程度、適合成人職場或日常溝通、優先使用 TOEIC 常見字彙、比學生的答案稍微完整（可加理由/細節/連接詞）、不要用過度艱深的學術英文。這是「更完整的說法」，不是唯一標準答案。
3. 只有當學生回答中有明顯值得學習的英文問題時，才加入 Quick Tip，只能解釋學生剛才回答中的問題，不可以變成新題目；沒有明顯問題就回傳 null。
4. 只回傳一個 JSON 物件，不要有其他文字、不要 markdown code fence：
{"positiveFeedback": "一兩句中文為主的正向回饋", "suggestedAnswer": "英文建議回答", "quickTip": "中文說明或 null"}`;
const ASK_SYSTEM = `你是英文口說教練，學生在練習途中主動問了一個關於英文的問題（文法、單字、說法、或請你再說一次）。請用清楚、簡短（3-5句內）、中文為主必要時搭配英文範例的方式回答。只回傳 JSON，不要有其他文字：{"answer": "..."}`;

async function submitAnswer(text){
  if(busy) return;
  busy = true;
  sendBtn.disabled = true;
  const step = currentUnit().steps[stepIndex];
  addMeMessage(text);
  mainInputRow.style.display = 'none';
  showTyping();
  try{
    const userContent = `目前題目 (${step.label}): "${step.question}"\n\n學生的回答: "${text}"\n\n請依照系統規則產生 JSON 回饋。`;
    const result = await callClaude(FEEDBACK_SYSTEM, userContent);
    hideTyping();
    addAiDialogue(`<span class="qlabel">🌟 STATUS</span>`, result.positiveFeedback || '', '🌟');
    await new Promise(r => setTimeout(r, 60));
    addRewardCard('💰 NEW PHRASE UNLOCKED', `<div class="en-line">${escapeHtml(result.suggestedAnswer || '')}</div>`);
    if(result.quickTip && result.quickTip !== 'null'){
      addRewardCard('🔎 QUICK TIP', `<div>${escapeHtml(result.quickTip)}</div>`, 'tip-card');
    }
    collectedSuggestions.push({ label: step.label, text: result.suggestedAnswer || '' });
    const row = document.createElement('div');
    row.className = 'next-btn-row';
    row.innerHTML = `<button class="next-btn" id="nextBtn">▶ 繼續任務</button>`;
    transcriptEl.appendChild(row);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    awardXp(10, row);
    document.getElementById('nextBtn').addEventListener('click', () => {
      row.remove();
      stepIndex += 1;
      askCurrentQuestion();
    }, { once:true });
  }catch(err){
    console.error('submitAnswer failed:', err);
    hideTyping();
    addSystemNote(`回饋產生時發生問題（${escapeHtml(err.message || '未知錯誤')}），請再回答一次試試看。`);
    mainInputRow.style.display = 'flex';
    answerInput.value = text;
  }finally{
    busy = false;
    sendBtn.disabled = false;
  }
}
sendBtn.addEventListener('click', () => {
  const text = answerInput.value.trim();
  if(!text) return;
  submitAnswer(text);
});
answerInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendBtn.click(); }
});

/* ---------------- Ask-a-question side flow ---------------- */
let askOpen = false;
askToggle.addEventListener('click', () => {
  askOpen = !askOpen;
  if(askOpen){
    askToggle.textContent = '✕ 收起提問';
    mainInputRow.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'full-row';
    row.id = 'askRow';
    row.innerHTML = `<div class="reward-card" style="background:linear-gradient(180deg,#F9EFD6,var(--parchment));">
      <div class="rc-title">💬 ASK COACH IVY</div>
      <div style="display:flex; gap:8px; margin-top:6px;">
        <textarea id="askInput" rows="1" style="flex:1; background:#fff; color:var(--ink); border:2px solid var(--wood-light); border-radius:8px; padding:8px 12px; font-family:'Inter',sans-serif; font-size:13.5px;" placeholder="例如：prefer 是什麼意思？"></textarea>
        <button class="send-btn" id="askSendBtn">➤</button>
      </div>
    </div>`;
    transcriptEl.appendChild(row);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    document.getElementById('askSendBtn').addEventListener('click', async () => {
      const q = document.getElementById('askInput').value.trim();
      if(!q) return;
      row.remove();
      addMeMessage(q);
      showTyping();
      try{
        const cur = currentUnit().steps[stepIndex];
        const ctx = `學生目前正在練習這題: "${cur ? cur.question : ''}"\n\n學生的問題: "${q}"`;
        const result = await callClaude(ASK_SYSTEM, ctx);
        hideTyping();
        addAiDialogue('', result.answer || '', '💡');
      }catch(err){
        hideTyping();
        addSystemNote('回答時發生問題，請再試一次。');
      }
      askOpen = false;
      askToggle.textContent = '💬 詢問一個英文問題';
      mainInputRow.style.display = 'flex';
    });
  } else {
    askToggle.textContent = '💬 詢問一個英文問題';
    const r = document.getElementById('askRow');
    if(r) r.remove();
    mainInputRow.style.display = 'flex';
  }
});

/* ---------------- Voice input ---------------- */
const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognitionImpl){
  recognition = new SpeechRecognitionImpl();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onresult = (e) => {
    const said = e.results[0][0].transcript;
    answerInput.value = (answerInput.value ? answerInput.value + ' ' : '') + said;
  };
  recognition.onend = () => { recognizing = false; micBtn.classList.remove('listening'); micBtn.innerHTML = '🎙'; };
  micBtn.addEventListener('click', () => {
    if(recognizing){ recognition.stop(); return; }
    recognizing = true;
    micBtn.classList.add('listening');
    micBtn.innerHTML = '<div class="wave"><span></span><span></span><span></span><span></span></div>';
    recognition.start();
  });
} else {
  micBtn.style.display = 'none';
}

/* ============================================================
   ADMIN PANEL (teacher tools)
   ============================================================ */
const settingsOverlay = document.getElementById('settingsOverlay');
const unitListEl = document.getElementById('unitList');
const materialInput = document.getElementById('materialInput');
const materialErr = document.getElementById('materialErr');

function renderUnitList(){
  unitListEl.innerHTML = '';
  UNITS.forEach((u, idx) => {
    const done = completedUnits.includes(u.id);
    const locked = idx > 0 && UNITS.slice(0, idx).some(p => !completedUnits.includes(p.id));
    const url = unitUrl(u.id);
    const statusLabel = done ? '★ 已通關' : (locked ? '🔒 未解鎖' : '▶ 可挑戰');
    const statusClass = done ? 'done' : (locked ? 'locked' : 'todo');
    const row = document.createElement('div');
    row.className = 'unit-row' + (locked ? ' locked' : '');
    row.innerHTML = `
      <div class="unit-row-top">
        <div class="unit-row-title"><span class="level-num">${idx + 1}</span>${escapeHtml(u.title)}</div>
        <div class="unit-status ${statusClass}">${statusLabel}</div>
      </div>
      <div class="unit-row-link">${escapeHtml(url)}</div>
      <div class="unit-row-actions">
        <button class="small-btn" data-action="copy" data-url="${escapeHtml(url)}">🔗 複製連結</button>
        <button class="small-btn" data-action="qr" data-id="${escapeHtml(u.id)}" data-url="${escapeHtml(url)}">▦ QR Code</button>
        <button class="small-btn" data-action="go" data-id="${escapeHtml(u.id)}">前往</button>
      </div>
      <div class="qr-box" id="qrbox-${escapeHtml(u.id)}"></div>
    `;
    unitListEl.appendChild(row);
  });
  unitListEl.querySelectorAll('button[data-action="copy"]').forEach(btn => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(btn.dataset.url).then(() => {
        btn.textContent = '已複製 ✓';
        setTimeout(() => btn.textContent = '🔗 複製連結', 1500);
      }).catch(() => {});
    });
  });
  unitListEl.querySelectorAll('button[data-action="go"]').forEach(btn => {
    btn.addEventListener('click', () => goToUnit(btn.dataset.id));
  });
  unitListEl.querySelectorAll('button[data-action="qr"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const box = document.getElementById('qrbox-' + id);
      const isOpen = box.classList.contains('open');
      unitListEl.querySelectorAll('.qr-box').forEach(b => { b.classList.remove('open'); b.innerHTML=''; });
      if(!isOpen){
        box.classList.add('open');
        if(window.QRCode){
          new QRCode(box, { text: btn.dataset.url, width: 128, height: 128, colorDark:"#2C2620", colorLight:"#ffffff" });
        } else {
          box.textContent = 'QR Code 產生器載入中，請稍候再試一次。';
        }
      }
    });
  });
}
document.getElementById('mapAdminBtn').addEventListener('click', () => {
  renderUnitList();
  materialInput.value = JSON.stringify(UNITS, null, 2);
  materialErr.style.display = 'none';
  settingsOverlay.classList.add('open');
});
document.getElementById('closeSettingsBtn').addEventListener('click', () => settingsOverlay.classList.remove('open'));
settingsOverlay.addEventListener('click', (e) => { if(e.target === settingsOverlay) settingsOverlay.classList.remove('open'); });
document.getElementById('loadDemoBtn').addEventListener('click', () => { materialInput.value = JSON.stringify(DEFAULT_UNITS, null, 2); });
document.getElementById('applyMaterialBtn').addEventListener('click', () => {
  try{
    const parsed = JSON.parse(materialInput.value);
    if(!Array.isArray(parsed) || parsed.length === 0) throw new Error('units array required');
    parsed.forEach(u => { if(!u.id || !u.title || !Array.isArray(u.steps)) throw new Error('invalid unit'); });
    UNITS = parsed;
    settingsOverlay.classList.remove('open');
    goHome();
  }catch(err){
    materialErr.style.display = 'block';
  }
});
document.getElementById('resetProgressBtn').addEventListener('click', async () => {
  completedUnits = [];
  totalXP = 0;
  renderXp();
  try{ await window.storage.set('completed-units', JSON.stringify([]), false); }catch(e){}
  try{ await window.storage.set('total-xp', '0', false); }catch(e){}
  renderUnitList();
  renderMap();
});

boot();
</script>
